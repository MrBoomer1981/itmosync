[project]
name = "itmosync"
version = "0.1.0"
description = "Sync the personal my.itmo class schedule into an iCloud calendar"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "caldav>=1.3",
    "icalendar>=6.0",
    "keyring>=25.0",
    "typer>=0.12",
    "rich>=13.7",
    "tzdata>=2024.1",
]

[project.scripts]
itmosync = "itmosync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itmosync"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "PTH", "TID", "RUF"]
# User-facing strings are Russian by design; the ambiguous-character rules fire on every one.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["itmosync", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["caldav.*", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["itmosync"]
branch = true

[tool.coverage.report]
# The spec requires >=90% on the core: sync.py and ical/mapper.py.
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
